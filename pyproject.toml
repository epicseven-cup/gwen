[project]
name = "gwen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ebooklib>=0.20",
    "pymupdf>=1.28.0",
    "pymupdf-layout>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "markdown>=3.7",
]

[project.scripts]
gwen = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]

